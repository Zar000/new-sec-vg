on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          uname -a
          gcc --version || true
          g++ --version || true
          make --version || true

      - name: Install distro dev packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential gcc g++ libssl-dev libboost-all-dev cmake pkg-config ca-certificates
          # optionally ensure GCC 12 if you specifically need it:
          # sudo apt-get install -y gcc-12 g++-12 && sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 && sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 100
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build
        run: make -j$(nproc)
