on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gcc:12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          uname -a
          gcc --version
          g++ --version
          make --version

      - name: Install distro dev packages (if needed)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            libssl-dev libboost-all-dev cmake pkg-config
        # remove the apt cache to keep runner clean
      - name: Build
        run: make -j$(nproc)
